# Runs the unit tests that Build made, on every platform. It does not build anything: the tests are the ones that Build uploaded.
# They read the JSON that monero-c writes, so they need no native library
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Pending
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    outputs:
      run-id: ${{ steps.wait.outputs.run-id }}

    steps:
      - name: Wait for the Build run of this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&event=$EVENT&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 20
          done
          if [ -z "$RUN_ID" ]; then echo "no Build run for $SHA"; exit 1; fi
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status || true)" = "completed" ]; do
            sleep 30
          done
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)
          if [ "$CONCLUSION" != "success" ]; then
            echo "Build run $RUN_ID concluded with $CONCLUSION"; exit 1
          fi
          MISSING=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '
            [.artifacts[] | select(.expired | not) | .name] as $available |
            ["monero-kotlin-tests"] |
            map(select(. as $name | $available | index($name) == null)) | .[]')
          if [ -n "$MISSING" ]; then
            echo "Build run $RUN_ID is missing required artifacts:"
            echo "$MISSING"
            exit 1
          fi
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests, ${{ matrix.platform }}
    needs: wait-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-24.04
          - platform: Linux arm64
            os: ubuntu-24.04-arm
          - platform: Windows x86_64
            os: windows-latest
          - platform: macOS arm64
            os: macos-15
          - platform: macOS x86_64
            os: macos-15-intel

    # Git Bash on Windows too
    defaults:
      run:
        shell: bash

    steps:
      - name: Download the unit tests
        uses: actions/download-artifact@v8
        with:
          name: monero-kotlin-tests
          path: unit-tests
          run-id: ${{ needs.wait-build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # the classes stay in directories, since the tests look for the classes of the model there
      - name: Run the unit tests
        run: >
          java -cp "unit-tests/lib/*" org.junit.platform.console.ConsoleLauncher execute
          --disable-banner --details=summary
          --class-path unit-tests/classes/main
          --class-path unit-tests/classes/test
          --class-path unit-tests/resources/test
          --scan-class-path unit-tests/classes/test
          --reports-dir test-results

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results
          if-no-files-found: ignore
