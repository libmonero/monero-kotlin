# Runs the integration tests that Build made against regtest nodes, with the library of monero-c that Native built from the submodule. The nodes
# and the wallet RPC servers are the ones of src/test/docker/docker-compose.yml, which are the ones of monero-python. The tests that need no
# node are in unit-tests.yml
name: Integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Pending
    runs-on: ubuntu-24.04
    # Native takes hours when it has to build monero-c, which it does when the submodule changes
    timeout-minutes: 180

    outputs:
      build-run-id: ${{ steps.build.outputs.run-id }}
      native-run-id: ${{ steps.native.outputs.run-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wait for the Build run of this commit
        id: build
        uses: ./.github/actions/wait-for-run
        with:
          workflow: build.yml
          artifacts: monero-kotlin-tests

      - name: Wait for the Native run of this commit
        id: native
        uses: ./.github/actions/wait-for-run
        with:
          workflow: native.yml
          artifacts: monero-c-linux-x86_64

  integration:
    name: Integration tests, Linux x86_64 (regtest node)
    needs: wait-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      COMPOSE_FILE: src/test/docker/docker-compose.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download the tests
        uses: actions/download-artifact@v8
        with:
          name: monero-kotlin-tests
          path: unit-tests
          run-id: ${{ needs.wait-build.outputs.build-run-id }}
          github-token: ${{ github.token }}

      # the library, with the libusb that it needs next to it
      - name: Download monero-c
        uses: actions/download-artifact@v8
        with:
          name: monero-c-linux-x86_64
          path: monero-c
          run-id: ${{ needs.wait-build.outputs.native-run-id }}
          github-token: ${{ github.token }}

      - name: Set the library of monero-c
        run: |
          if [ ! -f monero-c/libmonero_c.so ]; then echo "the build of monero-c has no libmonero_c.so"; ls monero-c; exit 1; fi
          ldd_out=$(ldd monero-c/libmonero_c.so || true)
          if grep -q 'not found' <<< "$ldd_out"; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi
          echo "MONERO_C_LIBRARY=$PWD/monero-c/libmonero_c.so" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Start the regtest nodes and the wallet RPC servers
        run: docker compose up -d node_1 node_2 xmr_wallet_1 xmr_wallet_2 xmr_wallet_3

      # the nodes and the servers have a login: curl does the digest authentication that monerod asks for
      - name: Wait for the node and the wallet RPC servers
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -fsS -m 5 --digest -u "$2" -X POST "http://127.0.0.1:$1/json_rpc" -d "{\"jsonrpc\":\"2.0\",\"id\":\"0\",\"method\":\"$3\"}" | grep -q "$4"; then
                return 0
              fi
              sleep 2
            done
            echo "nothing answered on the port $1"; return 1
          }
          wait_for 18081 rpc_daemon_user:abc123 get_block_count '"count"'
          for port in 18082 18083 18084; do wait_for "$port" rpc_user:abc123 get_version '"version"'; done

      # --fail-if-no-tests: a run that finds no integration test would pass without testing anything
      - name: Run the integration tests
        env:
          # the logs of the tests go in the results that are uploaded
          MONERO_KOTLIN_TEST_LOG_DIR: test-results/logs
        run: >
          java -cp "unit-tests/lib/*" org.junit.platform.console.ConsoleLauncher execute
          --disable-banner --details=summary
          --include-tag integration --fail-if-no-tests
          --class-path unit-tests/classes/main
          --class-path unit-tests/classes/test
          --class-path unit-tests/resources/test
          --scan-class-path unit-tests/classes/test
          --reports-dir test-results

      - name: Dump the logs of the containers
        if: always()
        run: |
          mkdir -p container-logs
          for service in node_1 node_2 xmr_wallet_1 xmr_wallet_2 xmr_wallet_3; do
            docker compose logs --no-color --timestamps "$service" > "container-logs/$service.log" 2>&1 || true
          done

      - name: Stop the regtest nodes and the wallet RPC servers
        if: always()
        run: docker compose down -v

      - name: Upload the logs of the containers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-container-logs
          path: container-logs
          if-no-files-found: ignore

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results
          if-no-files-found: ignore
