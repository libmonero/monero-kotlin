# Runs the integration tests that Build made against a regtest node and a monero-lws server, with the library of monero-c that Native built
# from the submodule. The node and the light wallet server are the ones of the docker-compose.yml of the integration tests, which runs the
# same monerod image as the one of monero-c. The tests that need no node are in unit-tests.yml
name: Integration tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Pending
    runs-on: ubuntu-24.04
    # Native takes hours when it has to build monero-c, which it does when the submodule changes
    timeout-minutes: 180

    outputs:
      build-run-id: ${{ steps.build.outputs.run-id }}
      native-run-id: ${{ steps.native.outputs.run-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wait for the Build run of this commit
        id: build
        uses: ./.github/actions/wait-for-run
        with:
          workflow: build.yml
          artifacts: monero-kotlin-tests

      - name: Wait for the Native run of this commit
        id: native
        uses: ./.github/actions/wait-for-run
        with:
          workflow: native.yml
          artifacts: monero-c-linux-x86_64

  integration:
    name: Integration tests, Linux x86_64 (regtest node and lws)
    needs: wait-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      MONERO_C_TEST_DAEMON_URI: http://127.0.0.1:18081
      MONERO_KOTLIN_TEST_LWS_URI: http://127.0.0.1:8443
      COMPOSE_FILE: src/test/integration/docker-compose.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download the tests
        uses: actions/download-artifact@v8
        with:
          name: monero-kotlin-tests
          path: unit-tests
          run-id: ${{ needs.wait-build.outputs.build-run-id }}
          github-token: ${{ github.token }}

      # the library, with the libusb that it needs next to it
      - name: Download monero-c
        uses: actions/download-artifact@v8
        with:
          name: monero-c-linux-x86_64
          path: monero-c
          run-id: ${{ needs.wait-build.outputs.native-run-id }}
          github-token: ${{ github.token }}

      - name: Set the library of monero-c
        run: |
          if [ ! -f monero-c/libmonero_c.so ]; then echo "the build of monero-c has no libmonero_c.so"; ls monero-c; exit 1; fi
          ldd_out=$(ldd monero-c/libmonero_c.so || true)
          if grep -q 'not found' <<< "$ldd_out"; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi
          echo "MONERO_C_LIBRARY=$PWD/monero-c/libmonero_c.so" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Start the regtest monerod and monero-lws
        run: docker compose up -d

      - name: Wait for monerod
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST "$MONERO_C_TEST_DAEMON_URI/json_rpc" -d '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}' | grep -q '"count"'; then
              exit 0
            fi
            sleep 2
          done
          echo "monerod did not answer"; exit 1

      # monero-lws answers only after it has scanned the chain of the node, which takes about a minute after it starts
      - name: Wait for monero-lws
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST "$MONERO_KOTLIN_TEST_LWS_URI/get_version" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "monero-lws did not answer"; exit 1

      # --fail-if-no-tests: a run that finds no integration test would pass without testing anything
      - name: Run the integration tests
        run: >
          java -cp "unit-tests/lib/*" org.junit.platform.console.ConsoleLauncher execute
          --disable-banner --details=summary
          --include-tag integration --fail-if-no-tests
          --class-path unit-tests/classes/main
          --class-path unit-tests/classes/test
          --class-path unit-tests/resources/test
          --scan-class-path unit-tests/classes/test
          --reports-dir test-results

      - name: Show the logs of the node
        if: failure()
        run: docker compose logs

      - name: Stop the regtest node
        if: always()
        run: docker compose down -v

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results
          if-no-files-found: ignore
