# Runs the integration tests that Build made against regtest nodes, with the library of the release of monero-c that Native took for the submodule. The nodes
# and the wallet RPC servers are the ones of src/test/docker/docker-compose.yml, which are the ones of monero-python. The tests that need no
# node are in unit-tests.yml
name: Integration tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'donate.png'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'donate.png'

permissions:
  contents: read
  actions: read

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wait-build:
    name: Pending
    runs-on: ubuntu-24.04
    # what it waits for is the Build run, and the Native run, which downloads the library
    timeout-minutes: 60

    outputs:
      build-run-id: ${{ steps.build.outputs.run-id }}
      native-run-id: ${{ steps.native.outputs.run-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the Build run of this commit
        id: build
        uses: ./.github/actions/wait-for-run
        with:
          workflow: build.yml
          artifacts: monero-kotlin-tests

      - name: Wait for the Native run of this commit
        id: native
        uses: ./.github/actions/wait-for-run
        with:
          workflow: native.yml
          artifacts: monero-c-linux-x86_64

  integration:
    name: Integration tests, Linux x86_64 (regtest node)
    needs: wait-build
    runs-on: ubuntu-24.04
    # the tests run for the full wallet and for the wallet of a server, which took 10 minutes for the full wallet alone
    timeout-minutes: 60

    env:
      COMPOSE_FILE: src/test/docker/docker-compose.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-kotlin-tests
          path: unit-tests
          run-id: ${{ needs.wait-build.outputs.build-run-id }}
          github-token: ${{ github.token }}

      # the library, with the libusb that it needs next to it
      - name: Download monero-c
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: monero-c-linux-x86_64
          path: monero-c
          run-id: ${{ needs.wait-build.outputs.native-run-id }}
          github-token: ${{ github.token }}

      - name: Set the library of monero-c
        run: |
          if [ ! -f monero-c/libmonero_c.so ]; then echo "the build of monero-c has no libmonero_c.so"; ls monero-c; exit 1; fi
          ldd_out=$(ldd monero-c/libmonero_c.so || true)
          if grep -q 'not found' <<< "$ldd_out"; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi
          echo "MONERO_C_LIBRARY=$PWD/monero-c/libmonero_c.so" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Start the regtest nodes and the wallet RPC servers
        run: docker compose up -d node_1 node_2 xmr_wallet_1 xmr_wallet_2 xmr_wallet_3

      # the nodes and the servers have a login: curl does the digest authentication that monerod asks for
      - name: Wait for the node and the wallet RPC servers
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -fsS -m 5 --digest -u "$2" -X POST "http://127.0.0.1:$1/json_rpc" -d "{\"jsonrpc\":\"2.0\",\"id\":\"0\",\"method\":\"$3\"}" | grep -q "$4"; then
                return 0
              fi
              sleep 2
            done
            echo "nothing answered on the port $1"; return 1
          }
          wait_for 18081 rpc_daemon_user:abc123 get_block_count '"count"'
          for port in 18082 18083 18084; do wait_for "$port" rpc_user:abc123 get_version '"version"'; done

      # monero-lws answers only after it has scanned the chain of the node, which takes about a minute after it starts
      - name: Wait for monero-lws
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST "$MONERO_KOTLIN_TEST_LWS_URI/get_version" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "monero-lws did not answer"; exit 1

      # --fail-if-no-tests: a run that finds no integration test would pass without testing anything
      - name: Run the integration tests
        env:
          # the logs of the tests go in the results that are uploaded
          MONERO_KOTLIN_TEST_LOG_DIR: test-results/logs
        run: >
          java -javaagent:unit-tests/jacoco/jacocoagent.jar=destfile=coverage/jacoco.exec,includes=monero.*
          -cp "unit-tests/lib/*" org.junit.platform.console.ConsoleLauncher execute
          --disable-banner --details=summary
          --include-tag integration --fail-if-no-tests
          --class-path unit-tests/classes/main
          --class-path unit-tests/classes/test
          --class-path unit-tests/resources/test
          --scan-class-path unit-tests/classes/test
          --reports-dir test-results

      # the report that Codacy reads, from the classes that ran. Whatever the tests did, the agent wrote what they ran. The coverage of the unit
      # tests is the one of unit-tests.yml, and codacy.yml sends both
      - name: Make the coverage report
        if: always() && hashFiles('coverage/jacoco.exec') != ''
        run: |
          mkdir coverage-reports
          java -jar unit-tests/jacoco/jacococli.jar report coverage/jacoco.exec \
            --classfiles unit-tests/classes/main \
            --xml coverage-reports/jacocoTestReport.xml

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: coverage-reports
          if-no-files-found: ignore

      - name: Dump the logs of the containers
        if: always()
        run: |
          mkdir -p container-logs
          for service in node_1 node_2 xmr_wallet_1 xmr_wallet_2 xmr_wallet_3; do
            docker compose logs --no-color --timestamps "$service" > "container-logs/$service.log" 2>&1 || true
          done

      - name: Stop the regtest nodes and the wallet RPC servers
        if: always()
        run: docker compose down -v

      - name: Upload the logs of the containers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-container-logs
          path: container-logs
          if-no-files-found: ignore

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-results
          path: test-results
          if-no-files-found: ignore

  light:
    name: Light wallet integration tests, Linux x86_64 (regtest node and monero-lws)
    needs: wait-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      MONERO_C_TEST_DAEMON_URI: http://127.0.0.1:18081
      MONERO_KOTLIN_TEST_LWS_URI: http://127.0.0.1:8443
      COMPOSE_FILE: src/test/integration/docker-compose.yml

    steps:
      # only monero-c, for its docker-compose.yml: the submodules of monero-c are not needed
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download the tests
        uses: actions/download-artifact@v8
        with:
          name: monero-kotlin-tests
          path: unit-tests
          run-id: ${{ needs.wait-build.outputs.build-run-id }}
          github-token: ${{ github.token }}

      # the library, with the libusb that it needs next to it
      - name: Download monero-c
        uses: actions/download-artifact@v8
        with:
          name: monero-c-linux-x86_64
          path: monero-c
          run-id: ${{ needs.wait-build.outputs.native-run-id }}
          github-token: ${{ github.token }}

      - name: Set the library of monero-c
        run: |
          if [ ! -f monero-c/libmonero_c.so ]; then echo "the build of monero-c has no libmonero_c.so"; ls monero-c; exit 1; fi
          ldd_out=$(ldd monero-c/libmonero_c.so || true)
          if grep -q 'not found' <<< "$ldd_out"; then
            echo "$ldd_out"
            echo "missing runtime libraries above"; exit 1
          fi
          echo "MONERO_C_LIBRARY=$PWD/monero-c/libmonero_c.so" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # the node starts alone first: the header of the compose file says why an lws that starts against a node
      # that is still initializing locks a wrong chain height and never scans
      - name: Start the regtest monerod
        run: docker compose up -d node

      - name: Wait for monerod
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST "$MONERO_C_TEST_DAEMON_URI/json_rpc" -d '{"jsonrpc":"2.0","id":"0","method":"get_block_count"}' | grep -q '"count"'; then
              exit 0
            fi
            sleep 2
          done
          echo "monerod did not answer"; exit 1

      - name: Start the monero-lws
        run: docker compose up -d lws

      # monero-lws answers only after it has scanned the chain of the node, which takes about a minute after it starts
      - name: Wait for monero-lws
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -m 5 -X POST "$MONERO_KOTLIN_TEST_LWS_URI/get_version" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "monero-lws did not answer"; exit 1

      # the light wallet tests need the light functions of monero-c, which the submodule of this branch carries
      # through its fork: they skip with a message when the library has no light wallet
      - name: Run the light wallet integration tests
        env:
          # the logs of the tests go in the results that are uploaded
          MONERO_KOTLIN_TEST_LOG_DIR: test-results/logs
        run: >
          java -cp "unit-tests/lib/*" org.junit.platform.console.ConsoleLauncher execute
          --disable-banner --details=summary
          --fail-if-no-tests
          --class-path unit-tests/classes/main
          --class-path unit-tests/classes/test
          --class-path unit-tests/resources/test
          --select-class monero.wallet.MoneroWalletLightIntegrationTest
          --select-class monero.wallet.MoneroWalletSendIntegrationTest
          --reports-dir test-results

      - name: Show the logs of the node and the server
        if: failure()
        run: docker compose logs

      - name: Stop the regtest node and the server
        if: always()
        run: docker compose down -v

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: light-integration-test-results
          path: test-results
          if-no-files-found: ignore
