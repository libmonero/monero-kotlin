# Builds the library and runs the unit tests of the data model, which read the JSON that monero-c writes, so they need no native library.
# The submodule monero-c is not checked out: nothing here needs it.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-24.04
          - platform: Windows x86_64
            os: windows-latest
          - platform: macOS arm64
            os: macos-15

    # gradlew is a shell script, which Git Bash runs on Windows too
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: ./gradlew build --console=plain

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore
