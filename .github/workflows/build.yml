# Builds the library and the unit tests of the data model. The tests run on every platform in test.yml, from the files that this uploads
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The submodule monero-c is not checked out: nothing here needs it
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: ./gradlew assemble unitTests --console=plain

      # the tests and the files they need, which test.yml runs on every platform without building them again
      - name: Upload the unit tests
        uses: actions/upload-artifact@v7
        with:
          name: monero-kotlin-tests
          path: build/unit-tests
          if-no-files-found: error
