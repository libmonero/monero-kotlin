# Builds the library and the unit tests of the data model, and collects the coverage of the tests. The tests run on every platform in unit-tests.yml, from
# the files that this uploads, and codacy.yml sends the coverage to Codacy
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The submodule monero-c is not checked out: nothing here needs it
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: ./gradlew assemble unitTests --console=plain

      # the tests and the files they need, which unit-tests.yml runs on every platform without building them again
      - name: Upload the unit tests
        uses: actions/upload-artifact@v7
        with:
          name: monero-kotlin-tests
          path: build/unit-tests
          if-no-files-found: error

      # The coverage needs the tests of the project, so the run is here. A failure of the collector does not fail Build: the tests of unit-tests.yml are the ones that count.
      - name: Collect the coverage
        id: coverage
        continue-on-error: true
        run: |
          ./gradlew test jacocoTestReport --console=plain
          mkdir coverage-reports
          cp build/reports/jacoco/test/jacocoTestReport.xml coverage-reports/

      - name: Upload the coverage report
        if: steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage-reports
          if-no-files-found: error
