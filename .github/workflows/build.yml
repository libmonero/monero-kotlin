# Builds the library and the unit tests of the data model. The tests run on every platform in unit-tests.yml, from the files that this
# uploads, and they come with the agent of JaCoCo that unit-tests.yml and integration-tests.yml run the tests with, for the coverage
name: Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'donate.png'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'donate.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The submodule monero-c is not checked out: nothing here needs it
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: ./gradlew assemble unitTests --console=plain

      # the tests and the files they need, which unit-tests.yml runs on every platform without building them again
      - name: Upload the unit tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monero-kotlin-tests
          path: build/unit-tests
          if-no-files-found: error
