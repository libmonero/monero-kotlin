# Gives the other workflows the library of monero-c for each platform where the tests run: the one in the archive of the release of monero-c that
# the submodule external/monero-c is pinned at, with the sha256 of the archive and the libusb that it needs next to it. It is uploaded as
# monero-c-<platform>. Nothing is built here, so a run takes a minute: before, it built monero-c, which took hours when the submodule changed.
# The pin has to be a release, and the check below fails if it is not: to test a commit of monero-c that is not released, build it by
# hand with the Build workflows of monero-c and set MONERO_C_LIBRARY, see docs/native-library.md
name: Native

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'donate.png'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'donate.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # The release of monero-c whose commit is the pin of the submodule, and the sha256 of each of its archives, from the SHA256SUMS.txt of
      # the release. Change them together with MONERO_C_VERSION of android.yml when the submodule moves to another release
      MONERO_C_VERSION: 0.4.0-alpha.1

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            arch: linux-x86_64
            extension: tar.gz
            sha256: fe5126c17e315fc88c310af643ec3ee00c4e6df90ed0d1230c52bc4f4b3c39b0
            files: libmonero_c.so libusb-1.0.so.0
          - name: Linux arm64
            arch: linux-arm64
            extension: tar.gz
            sha256: ef66d0e0ba452635614249b652ee98d4a424c37ec714f7eaf77afef5db602e5b
            files: libmonero_c.so libusb-1.0.so.0
          - name: macOS arm64
            arch: mac-arm64
            extension: tar.gz
            sha256: d56d714554c5fd9a7157c25ce231be40ea1f39a532b62a303d669ac2522e0e93
            files: libmonero_c.dylib libusb-1.0.0.dylib
          - name: macOS x86_64
            arch: mac-x86_64
            extension: tar.gz
            sha256: 8fae0c4bf32a59bb00d73a8d66aa3c02becee382573ce6e63bcb77bc90b271c2
            files: libmonero_c.dylib libusb-1.0.0.dylib
          - name: Windows x86_64
            arch: windows
            extension: zip
            sha256: d6bee4918d2610fff0743c3a9ff4e603028aeb70dc8926285fd6a6eaaabb892d
            files: libmonero_c.dll libusb-1.0.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # so that the archive is the library of the submodule and not an older or newer one
      - name: Check that the release is the pin of the submodule
        run: |
          pinned=$(git rev-parse HEAD:external/monero-c)
          released=$(git ls-remote https://github.com/mycomputercrashsalot/monero-c.git "refs/tags/v$MONERO_C_VERSION^{}" | cut -f1)
          test -n "$released" || { echo "::error::the fork of monero-c has no release v$MONERO_C_VERSION"; exit 1; }
          if [ "$pinned" != "$released" ]; then
            echo "::error::the submodule is at $pinned and v$MONERO_C_VERSION of the fork of monero-c is at $released: set MONERO_C_VERSION and the sha256 of native.yml, and MONERO_C_VERSION of android.yml, to the release of the submodule"
            exit 1
          fi

      - name: Download the library
        env:
          ARCHIVE: monero-c-${{ env.MONERO_C_VERSION }}-${{ matrix.arch }}.${{ matrix.extension }}
          SHA256: ${{ matrix.sha256 }}
          FILES: ${{ matrix.files }}
        run: |
          curl --retry 5 --retry-delay 5 --retry-max-time 150 -fsSL -o "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/mycomputercrashsalot/monero-c/releases/download/v$MONERO_C_VERSION/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c
          mkdir "$RUNNER_TEMP/archive"
          case "$ARCHIVE" in
            *.zip) unzip -q "$RUNNER_TEMP/$ARCHIVE" -d "$RUNNER_TEMP/archive" ;;
            *) tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/archive" ;;
          esac
          # the library and the libusb that it needs, as the build of monero-c put them, with no licenses or headers
          mkdir dist
          for file in $FILES; do
            cp "$RUNNER_TEMP/archive/monero-c-$MONERO_C_VERSION-${{ matrix.arch }}/$file" dist/
          done
          ls -l dist

      - name: Upload monero-c
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: monero-c-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
