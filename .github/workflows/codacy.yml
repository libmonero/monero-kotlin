name: Codacy Coverage Reporter

# Unit tests and Integration tests each upload the coverage of their tests, and Codacy merges the reports that it gets with one command: a line that
# both cover counts once. The two end at different times, so the end of each one starts this, and the one that finds the other ended sends both
on:
  workflow_run:
    workflows:
      - Unit tests
      - Integration tests
    types:
      - completed

permissions:
  contents: read
  actions: read

# the two ends of a commit can come together: one reports after the other
concurrency:
  group: codacy-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  report-coverage:
    # a run that was cancelled has no report. Tests that fail do not take it away, since the coverage is made after them
    if: github.repository == 'libmonero/monero-kotlin' && github.event.workflow_run.conclusion != 'cancelled' && (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      # the commit that the tests ran for, which is the head of the pull request
      COMMIT_UUID: ${{ github.event.workflow_run.head_sha }}
      # The reporter is downloaded for this version only, and runs only if its SHA-512 is the one here. The SHA-512 is also the one of
      # codacy-coverage-reporter-linux.SHA512SUM in the release of the version. To update: take the new version from
      # https://github.com/codacy/codacy-coverage-reporter/releases and its .SHA512SUM, and change both.
      CODACY_REPORTER_VERSION: 14.1.3
      CODACY_REPORTER_SHA512: 73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17
    steps:
      # the last run of each workflow for the commit. When one has not ended, its end sends the report, so this has nothing to do
      - name: Find the runs of the tests
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          ready=true
          for workflow in unit-tests integration-tests; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow.yml/runs?head_sha=$COMMIT_UUID&event=$EVENT&per_page=1" --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion)"')
            read -r id status conclusion <<< "$run"
            echo "$workflow: ${id:-no run} ${status:-} ${conclusion:-}"
            if [ -z "$id" ] || [ "$status" != completed ]; then ready=false; fi
            # the artifacts of a run that was cancelled or that has no coverage are not there to download
            if [ "$conclusion" = cancelled ]; then id=""; fi
            echo "${workflow%-tests}-run-id=$id" >> "$GITHUB_OUTPUT"
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then echo "::notice::The other tests have not ended: their end sends the coverage"; fi

      - name: Download the coverage of the unit tests
        id: unit
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.unit-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: coverage-reports/unit
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.unit-run-id }}

      - name: Download the coverage of the integration tests
        id: integration
        if: steps.runs.outputs.ready == 'true' && steps.runs.outputs.integration-run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: coverage-reports/integration
          github-token: ${{ github.token }}
          run-id: ${{ steps.runs.outputs.integration-run-id }}

      # the report of JaCoCo has the paths of the classes, e.g. monero/daemon/MoneroDaemonRpc.kt, and the sources are in src/main/kotlin/. The
      # reports that there are go in one command, so that Codacy merges them: with only one of them the coverage is lower, and the notice says it
      - name: Report Kotlin coverage
        if: steps.runs.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -z "$CODACY_PROJECT_TOKEN" ]; then
            echo "::notice::No CODACY_PROJECT_TOKEN secret, the coverage is not reported"
            exit 0
          fi
          reports=()
          for kind in unit integration; do
            if [ -f "coverage-reports/$kind/jacocoTestReport.xml" ]; then
              reports+=(-r "coverage-reports/$kind/jacocoTestReport.xml")
            else
              echo "::warning::No coverage report of the $kind tests"
            fi
          done
          if [ ${#reports[@]} -eq 0 ]; then echo "::warning::No coverage report to send"; exit 0; fi
          curl -fsSL -o codacy-coverage-reporter "https://artifacts.codacy.com/bin/codacy-coverage-reporter/$CODACY_REPORTER_VERSION/codacy-coverage-reporter-linux"
          echo "$CODACY_REPORTER_SHA512  codacy-coverage-reporter" | sha512sum -c -
          chmod +x codacy-coverage-reporter
          ./codacy-coverage-reporter report --language Kotlin --force-coverage-parser jacoco --prefix src/main/kotlin/ "${reports[@]}" --commit-uuid "$COMMIT_UUID"
