# Waits for the run that a workflow made for the commit that is tested, and checks that it ended well and that it uploaded the artifacts that are needed.
# The workflows that run the tests do not build anything: they use what Build and Native made for the same commit
name: Wait for a run
description: Wait for the run of a workflow for the commit that is tested, and get its id

inputs:
  workflow:
    description: the file of the workflow to wait for, e.g. build.yml
    required: true
  artifacts:
    description: the names of the artifacts that the run has to have, separated by spaces
    required: true

outputs:
  run-id:
    description: the id of the run
    value: ${{ steps.wait.outputs.run-id }}

runs:
  using: composite
  steps:
    - name: Wait for the run
      id: wait
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        EVENT: ${{ github.event_name }}
        WORKFLOW: ${{ inputs.workflow }}
        ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        RUN_ID=""
        for _ in $(seq 1 30); do
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?head_sha=$SHA&event=$EVENT&per_page=1" --jq '.workflow_runs[0].id // empty' || true)
          if [ -n "$RUN_ID" ]; then break; fi
          sleep 20
        done
        if [ -z "$RUN_ID" ]; then echo "no run of $WORKFLOW for $SHA"; exit 1; fi
        until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .status || true)" = "completed" ]; do
          sleep 30
        done
        CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)
        if [ "$CONCLUSION" != "success" ]; then
          echo "The run $RUN_ID of $WORKFLOW concluded with $CONCLUSION"; exit 1
        fi
        MISSING=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" | jq -r --arg names "$ARTIFACTS" '
          [.artifacts[] | select(.expired | not) | .name] as $available |
          $names | split(" ") | map(select(length > 0 and (. as $name | $available | index($name) == null))) | .[]')
        if [ -n "$MISSING" ]; then
          echo "The run $RUN_ID of $WORKFLOW is missing required artifacts:"
          echo "$MISSING"
          exit 1
        fi
        echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
