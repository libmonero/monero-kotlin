# the classes of a task run in the order of their names, so that the integration tests that need a fresh chain run
# before the ones that mine onto it: MoneroWalletLightIntegrationTest asserts the height of a fresh chain, and
# MoneroWalletSendIntegrationTest mines onto whatever chain it finds
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$ClassName
