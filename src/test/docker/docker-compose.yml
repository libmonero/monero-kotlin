# The nodes and the wallet RPC servers of the integration tests, which are the ones of tests/docker-compose.yml of monero-python: two regtest
# nodes that are connected to each other, with the login of its config.ini, and three wallet RPC servers. The images are the ones of
# libmonero/docker-monero-rpc, built from the same fork of monero as monero-cpp. MONERO_TAG pins them, for example MONERO_TAG=v0.18.5.1-1
#
# What is not the same as in monero-python: the difficulty is 1, as the tests mine with generateblocks, which needs one hash for a block
# at that difficulty, and they mine hundreds of blocks; and the log level is 1, because at 3 the nodes write tens of megabytes of log
# for those blocks, and the workflow uploads the logs.
#
# The tests use node_2 (18081) and the three wallet servers, since a server has one open wallet: xmr_wallet_1 (18082) holds the wallet that
# the tests share, and the wallets that a test makes are on xmr_wallet_2 (18083) and xmr_wallet_3 (18084):
#   docker compose -f src/test/docker/docker-compose.yml up -d node_1 node_2 xmr_wallet_1 xmr_wallet_2 xmr_wallet_3
#   docker compose -f src/test/docker/docker-compose.yml down -v
services:

  node_1:
    image: ghcr.io/libmonero/monero-daemon-rpc:${MONERO_TAG:-master}
    container_name: node_1
    command: [
      "--fixed-difficulty=1",
      "--log-level=1",
      "--p2p-bind-ip=0.0.0.0",
      "--p2p-bind-port=48080",
      "--rpc-bind-port=18089",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-access-control-origins=*",
      "--rpc-ssl=disabled",
      "--rpc-login=rpc_daemon_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--disable-rpc-ban",
      "--confirm-external-bind",
      "--add-exclusive-node=node_2:18080",
      "--regtest",
      "--hide-my-port",
      "--no-zmq",
      "--max-connections-per-ip=100"
    ]
    volumes:
      - xmr_node_1_data:/home/monero/.bitmonero
    ports:
      - "48080:48080"
      - "18089:18089"
    restart: on-failure

  node_2:
    image: ghcr.io/libmonero/monero-daemon-rpc:${MONERO_TAG:-master}
    container_name: node_2
    command: [
      "--fixed-difficulty=1",
      "--log-level=1",
      "--p2p-bind-ip=0.0.0.0",
      "--p2p-bind-port=18080",
      "--rpc-bind-ip=0.0.0.0",
      "--rpc-bind-port=18081",
      "--rpc-access-control-origins=*",
      "--rpc-ssl=disabled",
      "--rpc-max-connections-per-private-ip=100",
      "--rpc-login=rpc_daemon_user:abc123",
      "--zmq-rpc-bind-ip=0.0.0.0",
      "--zmq-rpc-bind-port=18085",
      "--zmq-pub=tcp://0.0.0.0:18086",
      "--disable-rpc-ban",
      "--confirm-external-bind",
      "--confirm-zmq-rpc-external-bind",
      "--add-exclusive-node=node_1:48080",
      "--regtest",
      "--hide-my-port",
      "--max-connections-per-ip=100"
    ]
    volumes:
      - xmr_node_2_data:/home/monero/.bitmonero
    ports:
      - "18080:18080"
      - "18081:18081"
      - "18085:18085"
      - "18086:18086"
    depends_on:
      - node_1
    restart: on-failure

  xmr_wallet_1:
    image: ghcr.io/libmonero/monero-wallet-rpc:${MONERO_TAG:-master}
    container_name: xmr_wallet_1
    command: [
      "--log-level=1",
      "--allow-mismatched-daemon-version",
      "--rpc-bind-ip=0.0.0.0",
      "--confirm-external-bind",
      "--rpc-bind-port=18082",
      "--trusted-daemon",
      "--daemon-address=node_2:18081",
      "--daemon-login=rpc_daemon_user:abc123",
      "--rpc-login=rpc_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--wallet-dir=/home/monero/wallets",
      "--rpc-access-control-origins=*",
      "--non-interactive"
    ]
    ports:
      - "18082:18082"
    volumes:
      - xmr_wallet_1_data:/home/monero/wallets
    depends_on:
      - node_1
      - node_2

  xmr_wallet_2:
    image: ghcr.io/libmonero/monero-wallet-rpc:${MONERO_TAG:-master}
    container_name: xmr_wallet_2
    command: [
      "--log-level=1",
      "--allow-mismatched-daemon-version",
      "--rpc-bind-ip=0.0.0.0",
      "--confirm-external-bind",
      "--rpc-bind-port=18083",
      "--trusted-daemon",
      "--daemon-address=node_2:18081",
      "--daemon-login=rpc_daemon_user:abc123",
      "--rpc-login=rpc_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--wallet-dir=/home/monero/wallets",
      "--rpc-access-control-origins=*",
      "--non-interactive"
    ]
    ports:
      - "18083:18083"
    volumes:
      - xmr_wallet_2_data:/home/monero/wallets
    depends_on:
      - node_1
      - node_2

  xmr_wallet_3:
    image: ghcr.io/libmonero/monero-wallet-rpc:${MONERO_TAG:-master}
    container_name: xmr_wallet_3
    command: [
      "--log-level=1",
      "--allow-mismatched-daemon-version",
      "--rpc-bind-ip=0.0.0.0",
      "--confirm-external-bind",
      "--rpc-bind-port=18084",
      "--trusted-daemon",
      "--daemon-address=node_2:18081",
      "--daemon-login=rpc_daemon_user:abc123",
      "--rpc-login=rpc_user:abc123",
      "--rpc-max-connections-per-private-ip=100",
      "--wallet-dir=/home/monero/wallets",
      "--rpc-access-control-origins=*",
      "--non-interactive"
    ]
    ports:
      - "18084:18084"
    volumes:
      - xmr_wallet_3_data:/home/monero/wallets
    depends_on:
      - node_1
      - node_2

volumes:
  xmr_node_1_data:
  xmr_node_2_data:
  xmr_wallet_1_data:
  xmr_wallet_2_data:
  xmr_wallet_3_data:
